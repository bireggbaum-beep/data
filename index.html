<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📜 Codex of Shadows</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e8e8e8;
            padding-bottom: 80px;
        }

        .header {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.4em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e8e8e8;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.2s;
        }

        .icon-btn:hover, .icon-btn.active {
            background: rgba(255,215,0,0.2);
            border-color: #ffd700;
            color: #ffd700;
        }

        .xp-section {
            margin-bottom: 12px;
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            margin-bottom: 6px;
        }

        .level-display {
            color: #ffd700;
            font-weight: 600;
        }

        .xp-display {
            color: #aaa;
        }

        .xp-bar-container {
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .xp-bar {
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-size: 0.8em;
            color: #888;
            margin-right: 4px;
        }

        .filter-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #aaa;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .filter-btn.active {
            background: rgba(255,215,0,0.2);
            border-color: #ffd700;
            color: #ffd700;
        }

        .world-dungeon.active { background: rgba(139,69,19,0.3); border-color: #8b4513; color: #daa520; }
        .world-greece.active { background: rgba(70,130,180,0.3); border-color: #4682b4; color: #87ceeb; }
        .world-real.active { background: rgba(60,179,113,0.3); border-color: #3cb371; color: #90ee90; }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
            font-size: 0.85em;
            color: #888;
        }

        .zoom-slider {
            width: 80px;
            accent-color: #ffd700;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .text-card {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: all 0.3s;
        }

        .text-card.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }

        .text-card.completed {
            border-color: rgba(255,215,0,0.3);
        }

        .card-header {
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .card-header:hover {
            background: rgba(255,255,255,0.05);
        }

        .card-title-section {
            flex: 1;
        }

        .card-title {
            font-size: 1.1em;
            color: #fff;
            margin-bottom: 4px;
        }

        .card-meta {
            font-size: 0.8em;
            color: #888;
            display: flex;
            gap: 12px;
        }

        .card-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .cr-badge {
            background: rgba(255,100,100,0.2);
            color: #ff6b6b;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
        }

        .xp-badge {
            color: #ffd700;
        }

        .world-badge {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.75em;
        }

        .world-badge.dungeon { background: rgba(139,69,19,0.3); color: #daa520; }
        .world-badge.greece { background: rgba(70,130,180,0.3); color: #87ceeb; }
        .world-badge.real { background: rgba(60,179,113,0.3); color: #90ee90; }

        .card-status {
            font-size: 1.2em;
            margin-left: 10px;
        }

        .card-content {
            display: none;
            padding: 0 15px 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .card-content.open {
            display: block;
        }

        .reading-text {
            line-height: 1.8;
            margin: 15px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            border-left: 3px solid #ffd700;
        }

        .vocab-section, .questions-section {
            margin-top: 15px;
        }

        .section-title {
            font-size: 0.85em;
            color: #ffd700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .vocab-list {
            display: grid;
            gap: 6px;
        }

        .vocab-item {
            display: flex;
            gap: 8px;
            font-size: 0.9em;
            padding: 6px 10px;
            background: rgba(255,215,0,0.1);
            border-radius: 6px;
        }

        .vocab-word {
            color: #ffd700;
            font-weight: 600;
            min-width: 120px;
        }

        .vocab-meaning {
            color: #ccc;
        }

        .questions-list {
            list-style: none;
        }

        .questions-list li {
            padding: 8px 0;
            padding-left: 20px;
            position: relative;
            font-size: 0.9em;
        }

        .questions-list li::before {
            content: "?";
            position: absolute;
            left: 0;
            color: #ffd700;
            font-weight: bold;
        }

        .complete-btn {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.3);
        }

        .complete-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .read-aloud-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: rgba(100, 149, 237, 0.3);
            border: 1px solid #6495ed;
            border-radius: 8px;
            color: #87ceeb;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .read-aloud-btn:hover {
            background: rgba(100, 149, 237, 0.5);
        }

        .read-aloud-btn.playing {
            background: rgba(255, 100, 100, 0.3);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.8em;
            color: #888;
        }

        .speed-slider {
            width: 100px;
            accent-color: #6495ed;
        }

        .sentence {
            transition: background 0.2s, color 0.2s;
            border-radius: 3px;
            padding: 0 2px;
        }

        .sentence.active {
            background: rgba(255, 215, 0, 0.3);
            color: #fff;
        }

        .lock-icon {
            font-size: 1.5em;
        }

        .level-up-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .level-up-overlay.show {
            display: flex;
        }

        .level-up-content {
            text-align: center;
            animation: levelUpPulse 0.5s ease-out;
        }

        @keyframes levelUpPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .level-up-text {
            font-size: 3em;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.5);
            margin-bottom: 10px;
        }

        .level-up-subtitle {
            font-size: 1.5em;
            color: #fff;
            margin-bottom: 20px;
        }

        .level-up-unlock {
            font-size: 1.1em;
            color: #90ee90;
        }

        .reset-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,50,50,0.2);
            border: 1px solid rgba(255,50,50,0.3);
            color: #ff6b6b;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .reset-btn:hover {
            background: rgba(255,50,50,0.3);
        }

        .save-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
            pointer-events: none;
        }

        .save-indicator.success {
            background: rgba(60, 179, 113, 0.3);
            border: 1px solid #3cb371;
            color: #90ee90;
            transform: translateY(0);
        }

        .save-indicator.error {
            background: rgba(255, 100, 100, 0.3);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #ff6b6b;
        }

        /* Fortschrittsbalken für Modell-Download */
        .model-progress {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 40px;
            border-radius: 16px;
            text-align: center;
            z-index: 2000;
        }
        .model-progress.show {
            display: block;
        }
        .model-progress bar {
            display: block;
            width: 300px;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
        }
        .model-progress bar fill {
            display: block;
            height: 100%;
            background: #ffd700;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-top">
            <h1 class="title">📜 Codex of Shadows</h1>
            <div class="header-buttons">
                <button class="icon-btn" id="wakeLockBtn" title="Keep Screen On">☀</button>
                <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
            </div>
        </div>

        <div class="xp-section">
            <div class="xp-header">
                <span class="level-display">Level <span id="currentLevel">1</span> — <span id="levelTitle">Novice</span></span>
                <span id="unitDisplay" style="color: #87ceeb; font-size: 0.82em; opacity: 0.85;"></span>
                <span class="xp-display"><span id="currentXP">0</span> / <span id="nextLevelXP">50</span> XP</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar" id="xpBar" style="width: 0%"></div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group" id="worldFilters">
                <span class="filter-label">World:</span>
                <button class="filter-btn active" data-world="all">All</button>
            </div>
            <div class="filter-group" id="crFilters">
                <span class="filter-label">CR:</span>
                <button class="filter-btn active" data-cr="all">All</button>
            </div>
            <div class="zoom-control">
                <span>Aa</span>
                <input type="range" class="zoom-slider" id="zoomSlider" min="14" max="26" value="18">
                <span>Aa</span>
            </div>
        </div>
    </header>

    <main class="container" id="textContainer">
        <div class="loading">Loading texts...</div>
    </main>

    <div class="level-up-overlay" id="levelUpOverlay">
        <div class="level-up-content">
            <div class="level-up-text">⚔ LEVEL UP! ⚔</div>
            <div class="level-up-subtitle">You reached Level <span id="newLevel">2</span>!</div>
            <div class="level-up-unlock" id="unlockText">New texts unlocked!</div>
        </div>
    </div>

    <button class="reset-btn" id="resetBtn">Reset Progress</button>
    <div id="saveIndicator" class="save-indicator"></div>

    <!-- Modell-Ladebalken -->
    <div id="modelProgress" class="model-progress">
        <div>🎙️ Downloading Kokoro TTS model…</div>
        <bar><fill id="modelProgressFill"></fill></bar>
        <div id="modelProgressText">0%</div>
    </div>

    <script type="module">
        // ==================== KOKORO TTS SETUP ====================
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.1.0/dist/transformers.min.js';

        // Verfügbare Stimmen (Sie können später einen Selector einbauen)
        const VOICES = ['af_bella', 'af_sarah', 'am_adam', 'am_michael', 'bf_emma', 'bm_george'];
        let selectedVoice = 'af_bella';  // Standardstimme
        let ttsPipeline = null;
        let modelLoading = false;
        let audioContext = null;

        // Model laden (wird beim ersten Read-Aloud-Klick angestoßen)
        async function loadModel(onProgress) {
            if (ttsPipeline) return true;
            if (modelLoading) return false;
            modelLoading = true;
            const progressDiv = document.getElementById('modelProgress');
            const progressFill = document.getElementById('modelProgressFill');
            const progressText = document.getElementById('modelProgressText');
            progressDiv.classList.add('show');

            try {
                ttsPipeline = await pipeline('text-to-speech', 'onnx-community/Kokoro-82M-v1.0', {
                    device: 'webgpu',  // Fallback auf CPU wenn WebGPU nicht verfügbar
                    progress_callback: (info) => {
                        if (info.status === 'progress') {
                            const percent = Math.round((info.loaded / info.total) * 100);
                            progressFill.style.width = percent + '%';
                            progressText.textContent = percent + '%';
                        }
                    }
                });
                progressDiv.classList.remove('show');
                modelLoading = false;
                return true;
            } catch (e) {
                console.error('Failed to load Kokoro model:', e);
                progressDiv.classList.remove('show');
                modelLoading = false;
                alert('Failed to load TTS model. Please try again later.');
                return false;
            }
        }

        // Audio-Context (muss nach Benutzerinteraktion initialisiert werden)
        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        // Generiert Audio für einen Satz und gibt die Dauer in Sekunden zurück
        async function synthesizeAndPlay(text, rate) {
            const ctx = getAudioContext();
            const result = await ttsPipeline(text, { voice: selectedVoice });
            const audioBuffer = ctx.createBuffer(1, result.audio.length, result.sampling_rate);
            audioBuffer.copyToChannel(result.audio, 0);

            const source = ctx.createBufferSource();
            source.buffer = audioBuffer;
            source.playbackRate.value = rate;
            source.connect(ctx.destination);

            // Promise das auf Ende wartet
            return new Promise((resolve) => {
                source.onended = resolve;
                source.start();
            });
        }

        // Globale Verfügbarkeit für den Rest der App
        window.kokoro = {
            loadModel,
            synthesizeAndPlay,
            VOICES,
            selectedVoice
        };
    </script>

    <script>
        // ╔════════════════════════════════════════════════════════════════╗
        // ║  JSON SOURCE                                                    ║
        // ╚════════════════════════════════════════════════════════════════╝
        const TEXTS_JSON_URL = './texts.json';

        // ╔════════════════════════════════════════════════════════════════╗
        // ║  AIRTABLE CONFIG - Progress Sync                               ║
        // ╚════════════════════════════════════════════════════════════════╝
        const AIRTABLE_API_URL = 'https://api.airtable.com/v0/appgWZEpl9pGBmZbk/progress';
        const AIRTABLE_TOKEN = 'patPLnPw8FTuQVPWw.bd0bc8db1415af5f2f7b16fd5cd20971cc637ca21681b6933843fb04deaa9f0e';
        
        let currentRecordId = null;
        let saveIndicatorTimeout = null;
        
        function showSaveIndicator(success, message) {
            const indicator = document.getElementById('saveIndicator');
            if (!indicator) return;
            
            indicator.textContent = (success ? '✅ ' : '❌ ') + message;
            indicator.className = 'save-indicator ' + (success ? 'success' : 'error');
            indicator.style.opacity = '1';

            clearTimeout(saveIndicatorTimeout);
            saveIndicatorTimeout = setTimeout(() => {
                indicator.style.opacity = '0';
            }, 3000);
        }

        // ... (Airtable save/load etc. unverändert) ...
        // [Der gesamte bisherige Code vor der TTS-Sektion bleibt erhalten. 
        //  Nur der TTS-Teil wird ersetzt.]

        // ==================== TTS (KOKORO) ====================
        let currentReadingId = null;
        let currentSentenceIndex = 0;
        let isPlaying = false;

        const DEFAULT_RATE = 1.0;

        function splitTextIntoSentences(text) {
            const result = text.match(/[^.!?]+[.!?]+/g);
            return result || [text];
        }

        function prepareSentences(textId) {
            const text = TEXTS.find(t => t.id === textId);
            if (!text) return;
            const container = document.getElementById(`text-${textId}`);
            if (!container) return;
            const sents = splitTextIntoSentences(text.text);
            container.innerHTML = sents.map((s, i) =>
                `<span class="sentence" id="sent-${textId}-${i}">${s.trim()}</span>`
            ).join(' ');
        }

        function restoreText(textId) {
            const text = TEXTS.find(t => t.id === textId);
            if (!text) return;
            const container = document.getElementById(`text-${textId}`);
            if (container) container.innerHTML = text.text;
        }

        function clearHighlights(textId) {
            const container = document.getElementById(`text-${textId}`);
            if (container) {
                container.querySelectorAll('.sentence').forEach(s => s.classList.remove('active'));
            }
        }

        function highlightSentence(textId, index) {
            clearHighlights(textId);
            const sent = document.getElementById(`sent-${textId}-${index}`);
            if (sent) {
                sent.classList.add('active');
                sent.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        async function speakSentence(textId, index) {
            if (!isPlaying || currentReadingId !== textId) return;

            const textObj = TEXTS.find(t => t.id === textId);
            if (!textObj) return;

            const sents = splitTextIntoSentences(textObj.text);
            if (index >= sents.length) {
                finishReading(textId);
                return;
            }

            const speedSlider = document.getElementById(`speed-${textId}`);
            const rate = speedSlider ? parseFloat(speedSlider.value) : DEFAULT_RATE;

            highlightSentence(textId, index);
            const sentenceText = sents[index].trim();

            try {
                await window.kokoro.synthesizeAndPlay(sentenceText, rate);
                // Nächster Satz
                if (isPlaying && currentReadingId === textId) {
                    currentSentenceIndex = index + 1;
                    speakSentence(textId, currentSentenceIndex);
                }
            } catch (error) {
                console.error('Kokoro TTS error:', error);
                if (isPlaying && currentReadingId === textId) {
                    currentSentenceIndex = index + 1;
                    speakSentence(textId, currentSentenceIndex);
                }
            }
        }

        function finishReading(textId) {
            const btn = document.getElementById(`read-btn-${textId}`);
            if (btn) {
                btn.innerHTML = '<span class="read-icon">🔊</span> Read Aloud';
                btn.classList.remove('playing');
            }
            restoreText(textId);
            currentReadingId = null;
            isPlaying = false;
        }

        async function toggleReadAloud(textId) {
            const btn = document.getElementById(`read-btn-${textId}`);

            // Wenn aktueller Text spielt -> Stopp
            if (currentReadingId === textId && isPlaying) {
                finishReading(textId);
                return;
            }

            // Anderen Text stoppen
            if (isPlaying && currentReadingId !== null) {
                finishReading(currentReadingId);
            }

            // Modell laden (falls noch nicht geschehen)
            const ready = await window.kokoro.loadModel();
            if (!ready) return;

            // Start
            currentReadingId = textId;
            currentSentenceIndex = 0;
            isPlaying = true;

            prepareSentences(textId);
            btn.innerHTML = '<span class="read-icon">⏹</span> Stop';
            btn.classList.add('playing');

            speakSentence(textId, 0);
        }

        // ... (Rest der App: Zoom, Fullscreen, WakeLock, Reset etc.) ...
    </script>
</body>
</html>
